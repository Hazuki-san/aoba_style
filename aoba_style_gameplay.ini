; Aoba Style Gameplay Patch
; ================================================
;
; Place this file in your sider folder (next to sider.ini),
; or in sider\modules\, alongside aoba_style_gameplay.lua.
;
; Add to sider.ini:  lua.module = "aoba_style_gameplay.lua"
;
; Only uncomment lines you want to change (by removing the leading "; ").
; The module already ships with good defaults - this file only fine-tunes them.
;
; All distances are in metres. All angles are in degrees.
; All timers are in seconds (multiplied by game speed internally).
;
; To reset a value to patch default, comment the line out (add ;)
; or delete it. The module only writes values it finds here.
;
; Format:  ; name = DEFAULT        ; vanilla: ORIGINAL_VALUE


; =====================
; FEATURE TOGGLES (1 = on, 0 = off)
; =====================
; Master switch for each subsystem. All default ON. Set to 0 to disable a whole
; feature without removing the module - useful for isolating what a feature does,
; or for stacking only the parts you want.
; Disable referee here if you run the standalone referee_strictness.lua
; (the two patch the same code - do not run both).

; feature_dribble      = 1        ; pass-vs-dribble gate, tiers, teammate filter, secondary eval
; feature_first_touch  = 1        ; trap / receive ball displacement scaling
; feature_second_touch = 1        ; gear-down dribble push cap
; feature_pressing     = 1        ; AI press distances
; feature_defensive    = 1        ; defender engage angle / radius
; feature_goalkeeper   = 1        ; GK prejump timing + save quality
; feature_ball_physics = 1        ; engine flight constants
; feature_reaction     = 1        ; animation reaction scalar
; feature_early_cross  = 1        ; Early Cross COM style margin
; feature_fk_walljump  = 1        ; free-kick wall jump timing
; feature_fixes        = 1        ; engine bug fixes (SS hole, Legend tier, morale, dribble->shot)
; feature_referee      = 1        ; foul / card thresholds (also standalone as referee_strictness.lua)


; =====================
; CPU PRESSING (how far AI defenders chase the ball carrier)
; =====================
; Maximum distance (in metres) at which AI players will leave their position to
; press. Lower = defenders stay in shape. Higher = more aggressive chasing
; (can open midfield gaps).
; Typical feel: ~14 = sits in a deep block, ~18 (patch) = balanced,
;               ~22 (vanilla) = high press, ~26 = chases everywhere.

; press_team          = 18.0      ; vanilla: 22.0 - team pressing flag active
; press_teamdefence   = 19.0      ; vanilla: 22.0 - team-wide defensive commit (condition 13)
; press_manmark       = 12.0      ; vanilla: 15.0 - tracking a specific marked opponent
; press_vital         = 10.0      ; vanilla: 13.0 - opponent attacking through the centre (VITAL area)
; press_vital_floor   = 14.0      ; vanilla: 12.0 - minimum press range when attack area >= VITAL
; press_second_filter = 6.0       ; vanilla: 6.0  - second distance filter (non-Legend)
; press_legend_filter = 8.0       ; vanilla: 12.0 - second distance filter (Legend or VITAL attack)


; =====================
; ANGLE GATE (Pass vs Dribble decision)
; =====================
; Facing-angle threshold for the stat-aware dribble decision. Wider angle = the
; AI is willing to dribble even when not squared up to its target = more dribbling.
;   base     = the threshold for the worst dribblers (45 patch, 40 vanilla).
;   scale    = how much better dribblers widen it (higher = bigger gap between
;              star and poor dribblers).
;   tier_div = difficulty scaling (higher difficulty tightens the threshold).
; Vanilla is a flat 40 for everyone, with no stat or difficulty scaling.

; angle_gate_base     = 45.0      ; vanilla: 40.0 (flat for everyone)
; angle_gate_scale    = 0.6779661 ; vanilla: n/a  (no stat scaling)
; angle_gate_tier_div = 6.0       ; vanilla: n/a  (no difficulty scaling)


; =====================
; DRIBBLE PRE-GATE
; =====================
; Facing-angle check BEFORE the stat-aware gate runs. If the player faces wider
; than this from the dribble direction, the AI skips dribbling entirely and
; evaluates passes/crosses instead.
; Lower = passes earlier (30 vanilla), higher = holds the ball through wider
; turns (35 patch; ~45 starts to look stubborn).

; dribble_pregate     = 35.0      ; vanilla: 30.0


; =====================
; DRIBBLE TEAMMATE FILTER
; =====================
;   min_dist   = teammates closer than this are ignored, metres (so a support
;                runner glued to the carrier doesn't force a pass). 0 = vanilla.
;   cone_limit = only teammates within this angle of the dribble direction count.
;                90 (patch) = look ahead only; 360 (vanilla) = even players behind count.

; dribble_min_dist    = 2.5       ; vanilla: 0.0   (any distance counts)
; dribble_cone_limit  = 90.0      ; vanilla: 360.0 (all directions count)


; =====================
; DRIBBLE TIER TABLE
; =====================
; Four tiers of dribble-gate parameters, selected by Dribbling stat:
;   floor        = corridor distance threshold (metres)
;   angle        = facing angle limit (degrees)
;   timer        = ball control timer multiplier
;   corridor_mul = corridor expansion factor
; Tier 0 = low Dribbling (no bonuses) ... Tier 3 = elite.
; Higher tiers get a smaller floor and wider angle, so stars attempt tighter
; dribbles in more situations - e.g. raise tier3_angle to let them weave through
; traffic, or raise tier0_floor to keep weak dribblers simple.
; Vanilla has NO tiers - everyone uses floor=15, angle=30, timer=0.5, mul=1.2.
; Keep ONE setting per line: ';' starts a comment, so packing several on one line
; drops all but the first.

; tier0_floor        = 12.0       ; vanilla: 15.0
; tier0_angle        = 34.0       ; vanilla: 30.0
; tier0_timer        = 0.5        ; vanilla: 0.5
; tier0_corridor_mul = 1.1        ; vanilla: 1.2

; tier1_floor        = 8.0        ; vanilla: 15.0
; tier1_angle        = 40.0       ; vanilla: 30.0
; tier1_timer        = 1.0        ; vanilla: 0.5
; tier1_corridor_mul = 1.0        ; vanilla: 1.2

; tier2_floor        = 5.0        ; vanilla: 15.0
; tier2_angle        = 45.0       ; vanilla: 30.0
; tier2_timer        = 1.5        ; vanilla: 0.5
; tier2_corridor_mul = 0.9        ; vanilla: 1.2

; tier3_floor        = 3.0        ; vanilla: 15.0
; tier3_angle        = 50.0       ; vanilla: 30.0
; tier3_timer        = 2.0        ; vanilla: 0.5
; tier3_corridor_mul = 0.8        ; vanilla: 1.2


; =====================
; FIRST TOUCH / BALL CONTROL
; =====================
; How far the ball travels from the player on a trap/receive. Vanilla gives
; everyone the same displacement regardless of Ball Control (~1.5m at run,
; ~2.25m at sprint). This scales it by the stat, then caps it.
;   scale   = how strongly Ball Control tightens the touch. Higher = bigger gap
;             between good and bad first touches (bad players' touches get away
;             from them; elite players keep it close).
;   floor   = how tight an elite touch can get (lower = tighter).
;   abs_min = minimum ball distance in metres (collision safety - leave it).
;   cap_base, cap_scale = a hard ceiling on touch distance. Lower cap_base =
;             tidier touches for everyone; cap_scale lets higher Ball Control
;             pull that ceiling down further.
; Kicks and set pieces are NOT affected (separate code path).

; bc_scale     = 0.007            ; vanilla: n/a (per Ball Control point above 50)
; bc_floor     = 0.55             ; vanilla: n/a (minimum scaling factor, 0.0-1.0)
; bc_abs_min   = 0.50             ; vanilla: n/a (minimum ball distance in metres)
; bc_cap_base  = 2.5              ; vanilla: n/a (displacement cap base, metres)
; bc_cap_scale = 0.013            ; vanilla: n/a (cap reduction per Ball Control point)


; =====================
; SECOND TOUCH (gear-down dribble push)
; =====================
; When the AI receives a firm pass and gears into a dribble, vanilla pushes the
; ball forward at a flat speed regardless of skill. This caps that push toward a
; skill-based ceiling so low-rated players don't knock it beyond reach.
; The push speed is capped between lo (low-skill players, ~23 km/h) and hi
; (elite, ~28 km/h), scaled by the player's Dribbling and Speed. It only ever
; caps the push - never speeds it up. Lower st_lo to tame heavy low-skill
; touches; raise st_hi if elites still overrun the ball.

; st_lo    = 23.0                 ; vanilla: n/a - push ceiling (km/h) at low (Dribbling+Speed)/2
; st_hi    = 28.0                 ; vanilla: n/a - push ceiling (km/h) at elite (Dribbling+Speed)/2
; st_pivot = 40.0                 ; vanilla: n/a - stat where scaling starts
; st_span  = 60.0                 ; vanilla: n/a - stat range it ramps over


; =====================
; DEFENSIVE BEHAVIOUR
; =====================
;   engage_angle  = how square the approach must be to trigger a committed tackle
;                   (degrees). 100 = vanilla, 105 = patch (commits a touch more readily).
;   engage_radius = minimum engagement distance (metres). 6 (vanilla) = holds off,
;                   8 (patch) = steps up, ~10 = dives in early (more aggressive but beatable).

; def_engage_angle    = 105.0     ; vanilla: 100.0
; def_engage_radius   = 8.0       ; vanilla: 6.0


; =====================
; EARLY CROSS
; =====================
; Penalty-area width margin for the early-cross trigger.
;   normal = margin for players WITHOUT the Early Cross COM playstyle
;   trait  = margin for players WITH it
; LOWER value = STRONGER effect (crosses from wider/earlier positions).
;   3.0 = vanilla (no advantage), 0.3 = patch default, -1.0 = very aggressive.
; Negatives are valid. I wouldn't go beyond -5.0, but you do you.

; earlycross_normal   = 2.6125    ; vanilla: 3.0 (no style difference)
; earlycross_trait    = 0.3       ; vanilla: 3.0 (no style difference)


; =====================
; GK PREJUMP TIMING
; =====================
; Base duration (seconds) before stat scaling kicks in. Lower = faster GK
; commitment. Actual duration is further scaled by the GK Reach stat.
;   medium = 45/135/180 degree rotation prejump
;   long   = 90 degree rotation prejump
; e.g. 0.20 (vanilla) sets late, 0.16 (patch) is quicker, ~0.10 commits very
; early (can be wrong-footed), ~0.30 is hesitant.

; gk_prejump_medium   = 0.16      ; vanilla: 0.20
; gk_prejump_long     = 0.20      ; vanilla: 0.25


; =====================
; FK WALL JUMP
; =====================
;   dur_base  = base jump duration before stat scaling (seconds). 0.167 = vanilla
;               flat; 0.215 (patch) gives a slightly longer hang.
;   spd_scale = how much higher Jump speeds up the jump animation (higher =
;               bigger difference between good and bad jumpers).
;   spd_base  = baseline playback speed for the weakest jumpers.
;   inv100    = math constant - DO NOT CHANGE (breaks the scaling formula).

; wall_dur_base       = 0.215     ; vanilla: 0.167 (flat, no stat scaling)
; wall_spd_scale      = 0.003     ; vanilla: n/a   (random 0.9-1.2)
; wall_spd_base       = 1.0       ; vanilla: n/a   (random 0.9-1.2)
; wall_inv100         = 0.01      ; vanilla: n/a   - DO NOT CHANGE


; =====================
; ANIMATION SPEED SCALAR
; =====================
; Global animation playback speed multiplier. Affects EVERY animation - usually
; player body, but can touch hands and faces too. Higher = faster animations.
; 5.0 is vanilla; nudge by small amounts only (e.g. 5.5) - large changes desync
; everything. Change with extreme caution.

; gani_anim_speed     = 5.0       ; vanilla: 5.0


; =====================
; BALL PHYSICS (engine-level constants)
; =====================
; The physical simulation of the ball in flight. Independent of dt18 mods -
; dt18 controls kick types and power curves, these control how physics processes
; the result.
;
; Kick speed: launch velocity = force_kph * bp_kick_speed / (GameSpeed * 3600).
; The force is already in km/h (93-140 for shots), so bp_kick_speed scales ALL
; launches - shots, passes, crosses - equally. Stat scaling still applies.

; bp_kick_speed       = 1000.0    ; vanilla: 1000.0 (m/km unit factor)
                                  ;   2000 = ball 2x faster, 500 = 2x slower
; bp_gravity          = 9.80665   ; vanilla: 9.80665 - gravity (m/s^2)
                                  ;   Moon=1.6, Mars=3.7, Jupiter=24.8, zero-G=0.001
; bp_bounce           = -0.7      ; vanilla: -0.7   - ground bounce restitution
                                  ;   -1.0 = perfect bounce, -0.3 = dead ball, 0 = none
; bp_collision_scale  = 1.0       ; vanilla: 1.0    - player/post collision force multiplier
                                  ;   2.0 = players ping off harder, 0.5 = softer
; bp_drag_factor      = -0.5      ; vanilla: -0.5   - the -1/2 from the drag equation
                                  ;   -0.25 = half drag (flies further), 0 = vacuum (no drag)
; bp_air_density      = 1.293     ; vanilla: 1.293  - air density kg/m^3 (sea level 15C)
                                  ;   0.4 = high altitude, 1.225 = FIFA std, 5.0 = underwater
; bp_cross_section    = 0.037110474 ; vanilla: 0.0371 - ball cross-section (m^2, size 5)
                                  ;   bigger = more drag and swerve, smaller = flies straighter/further
; bp_pass_base        = 101.5     ; vanilla: 101.5  - base launch speed, lofted/long pass (km/h)
; bp_pass_fk          = 103.0     ; vanilla: 103.0  - base launch speed, free-kick pass (km/h)


; =====================
; REFEREE THRESHOLDS (byte values 0-255)
; =====================
; When fouls are called and what cards are given. Lower = stricter.
; Score = FoulScoringA (contact, 0-40) + B (velocity, 0-30) + C (context, 0-80),
; compared against these thresholds.
;   ref_t1_outside: ~30 = whistle-happy, 38 (patch), 40 (vanilla), ~50 = lets play flow
;   ref_t1_inside : low = penalties given easily; 35 (patch) vs 60 (vanilla, very lenient)
;   ref_t2        : lower = more yellows (70 patch vs 80 vanilla)
;   ref_t3        : lower = more reds (105 patch vs 110 vanilla)

; ref_t1_outside = 38             ; vanilla: 40  - foul threshold outside box
; ref_t1_inside  = 35             ; vanilla: 60  - foul threshold inside box (penalty)
; ref_t2         = 70             ; vanilla: 80  - yellow card threshold
; ref_t3         = 105            ; vanilla: 110 - red card threshold
;
; Gate toggles (0 = active/normal, 1 = bypassed). Gate 0 is safe to toggle
; (DOGSO rules preference). Gates 1-3 are safety guards - leave them unless
; you are deliberately testing something.
; ref_gate0_off  = 0              ; DOGSO in-box red -> yellow cap (pre/post-2016 rules)
; ref_gate1_off  = 0              ; cutscene/demo suppression - do not disable
; ref_gate2_off  = 0              ; match "no cards" rule - do not disable
; ref_gate3_off  = 0              ; ball out of play - do not disable
