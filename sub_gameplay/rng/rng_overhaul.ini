; ============================================
; RNG Overhaul for PES 2021
; ============================================
;
; Nothing interesting, except perhaps make your game feel a little different.
;
; mode
;   1 = LCG multiplier swap
;       Changes the constant in the existing Linear Congruential
;       Generator. Same algorithm, different sequence. Lightest
;       touch. Uses "multiplier" and "slot3_mult" below.
;
;   2 = Full xorshift32 replacement
;       Replaces the entire LCG with xorshift32. Better spectral
;       quality, no lattice artifacts. Ignores "multiplier" and
;       "slot3_mult" entirely.
;
mode = 2

; =========================================
; Mode 1 settings (ignored when mode = 2)
; =========================================
;
; multiplier
;   The main LCG constant. Replaces 0x2D22B2E3 at all 6 sites.
;   Must be odd and greater than 1. Even values or 0/1 will
;   collapse the generator to a short cycle or constant output.
;
;   Presets (all proven full-period for mod 2^31):
;
;   0x5851F42D  Knuth MMIX        - best spectral scores
;   0x6B84F733  Numerical Recipes - good all-round
;   0x43FD43FD  MSVC rand()       - widely tested
;   0x0BB38435  Borland Delphi    - classic, adequate
;
multiplier = 0x5851F42D

; slot3_mult
;   Slot 3 uses a separate weak 15-bit LCG:
;     state = (N * state + 7) & 0x7FFF
;   Original N is 21. Output range is [0, 32767].
;   Used for low-precision randomness (animation variants,
;   minor cosmetic choices).
;
;   Must be odd for full period (32768). Small odd primes
;   give the best distribution:
;
;    53  - good spacing, recommended
;    37  - slightly tighter clustering
;    69  - wider spacing
;   101  - maximum spread for 15-bit
;
slot3_mult = 53
