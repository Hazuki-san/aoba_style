; ============================================
; Referee Strictness for PES 2021
; ============================================
;
; Controls foul severity - how harshly detected fouls are
; punished. Does NOT change what the referee considers a foul.
;
; FOUL SEVERITY THRESHOLDS
; ------------------------
; FoulScoringA+B+C produces a combined score (0-150 realistic).
; ScoreToSeverity maps it to severity 0-4:
;
;   score < T1          -> 0  nothing
;   T1 ≤ score < mid    -> 1  foul / penalty, no card
;   mid ≤ score < T2    -> 2  foul + accumulate
;   T2 ≤ score < T3     -> 3  yellow card
;   score ≥ T3          -> 4  red card
;
; where mid = T1 + (T2 - T1) / 2
; Ordering MUST be: T1 < T2 < T3
;
; PRESETS (uncomment one block):
;
; --- Vanilla (equalized) ---
; T1_outside = 40
; T1_inside  = 40
; T2         = 80
; T3         = 110
;
; --- Moderate (recommended) ---
T1_outside = 38
T1_inside  = 35
T2         = 70
T3         = 110
;
; --- Strict ---
; T1_outside = 35
; T1_inside  = 30
; T2         = 65
; T3         = 105
;
; --- Simulation ---
; T1_outside = 30
; T1_inside  = 25
; T2         = 60
; T3         = 100
;
; DOGSO RED CARD
; --------------
; Vanilla caps DOGSO fouls inside the box at severity 3 (yellow)
; instead of 4 (red). Matches post-2016 IFAB triple punishment rule.
; Set to 1 to allow straight reds for DOGSO in-box.
dogso_red = 0
